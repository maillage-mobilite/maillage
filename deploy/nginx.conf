# Configuration nginx du conteneur maillage-web (démonstrateur privé, build Vite).
# Le HTTPS est assuré en amont par le proxy Traefik de Coolify ; ce serveur ne reçoit que du HTTP interne.
# --- Mesure d'usage, sans adresse IP ni cookie ---
# Une ligne par affichage de l'encart (/widget.html) et par ouverture de l'application (/ ou /index.html,
# réponse 200 ou 304 après authentification) : date, événement, compte, site d'origine (nom d'hôte seul),
# territoire, commune, provenance (?src=encart…), type d'appareil, format de l'encart. Robots et outils en ligne de commande exclus.
# Lecture : demonstrateur/deploy/stats.sh
map $uri $usage_evt { /widget.html encart; / appli; /index.html appli; default ""; }
map "$usage_evt:$status" $usage_hit { "~^(encart|appli):(200|304)$" 1; default 0; }
map $http_user_agent $usage_bot { "" 1; "~*(bot|crawl|spider|slurp|preview|curl|wget|python|httpclient|headless|lighthouse)" 1; default 0; }
map "$usage_hit$usage_bot" $usage_log { 10 1; default 0; }
map $http_referer $usage_ref { "~^https?://(?<h>[^/:?#]+)" $h; default "-"; }
map $http_user_agent $usage_device { "~*(iphone|android.+mobile|mobile)" mobile; "~*(ipad|tablet|android)" tablette; default ordinateur; }
log_format usage '$time_iso8601 $usage_evt $remote_user $usage_ref ${arg_reseau}- ${arg_commune}- ${arg_src}- $usage_device ${arg_format}-';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    # seul journal d'accès : la mesure d'usage anonyme ci-dessus (remplace le journal nginx standard, qui contient les IP)
    access_log /var/log/maillage/usage.log usage if=$usage_log;

    # Accès privé : identifiant + mot de passe (comptes dans /srv/sites/maillage/private/htpasswd).
    # Sans ce fichier, nginx répond 500 : rien n'est jamais servi sans authentification.
    auth_basic "Maillage - demonstrateur prive";
    auth_basic_user_file /etc/nginx/htpasswd;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json application/geo+json image/svg+xml text/plain application/xml;
    gzip_min_length 512;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # géolocalisation autorisée pour le site lui-même (« autour de moi »)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), interest-cohort=()" always;

    # .geojson (tracés des lignes) absent de mime.types : seul type inconnu servi, compressé grâce à ce type
    default_type application/geo+json;

    # Fichiers cachés : jamais servis
    location ~ /\. { deny all; return 404; }

    # --- Encart public « prochains départs » (intégré en iframe sur les sites des communes) ---
    # Seules exceptions à l'accès privé : la page de l'encart, ses deux fichiers JS/CSS et les
    # fichiers widget-<commune>.json (horaires théoriques déjà ouverts). Le reste demande toujours le mot de passe.
    # Sites autorisés à afficher l'encart : 'self' + communes listées dans frame-ancestors.
    location = /widget.html {
        auth_basic off;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # ornex.local : copie locale du site de la ville (Local), pour les démonstrations ; nom résolu sur le poste seulement
        add_header Content-Security-Policy "frame-ancestors 'self' https://ornex.fr https://www.ornex.fr http://ornex.local https://ornex.local" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        try_files $uri =404;
    }
    location ~ ^/data/[a-z0-9-]+/widget-[a-z0-9-]+\.json$ {
        auth_basic off;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Fichiers de l'application : noms hachés par Vite, cache long
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # JS/CSS de l'encart : publics (voir plus haut)
        location ~ ^/assets/(widget|modulepreload-polyfill)-[A-Za-z0-9_-]+\.(js|css)$ {
            auth_basic off;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
        }
    }

    # Page et données du réseau (régénérées par le pipeline) : revalidées à chaque visite
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ =404;
    }
}
