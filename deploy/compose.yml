# Maillage (démonstrateur transports) : site statique privé servi par nginx derrière le proxy Traefik de Coolify.
# Publication : demonstrateur/deploy/deploy-vps.sh depuis le Mac (build Vite, rsync → site/).
# Relancer : cd /srv/sites/maillage && sudo docker compose -f compose.yml -f compose.domain.yml up -d
# (copie versionnée : local-sites/perso/maillage/demonstrateur/deploy/)
services:
  web:
    image: nginx:1.27-alpine
    container_name: maillage-web
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site:/usr/share/nginx/html:ro
      # comptes d'accès (hors dossier web) : private/htpasswd, root:101 640 (101 = nginx dans l'image alpine)
      - ./private/htpasswd:/etc/nginx/htpasswd:ro
    networks: [coolify]
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.services.maillage.loadbalancer.server.port: "80"
networks:
  coolify:
    external: true
