# Maillage (démonstrateur transports) : site statique privé servi par nginx derrière le proxy Traefik de Coolify.
# Publication : demonstrateur/deploy/deploy-vps.sh depuis le Mac (build Vite, rsync → site/).
# Relancer : cd /srv/sites/maillage && sudo docker compose -f compose.yml -f compose.domain.yml up -d
# (copie versionnée : local-sites/perso/maillage/demonstrateur/deploy/)
services:
  web:
    image: nginx:1.27-alpine
    container_name: maillage-web
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site:/usr/share/nginx/html:ro
      # comptes d'accès (hors dossier web) : private/htpasswd, root:101 640 (101 = nginx dans l'image alpine)
      - ./private/htpasswd:/etc/nginx/htpasswd:ro
      # sites autorisés à afficher l'encart (frame-ancestors), écrit par deploy-vps.sh --config
      - ./private/encart-sites.conf:/etc/nginx/encart-sites.conf:ro
      # mesure d'usage anonyme (usage.log, sans IP), lue par demonstrateur/deploy/stats.sh
      - ./logs:/var/log/maillage
      # messages et lieux publiés par les mairies (écrits par le service « mairie »)
      - ./contenus:/usr/share/nginx/contenus:ro
    networks: [coolify, interne]
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.services.maillage.loadbalancer.server.port: "80"
  # Espace mairie (mairie/serveur.py) : joignable seulement par nginx (/api/mairie/), jamais directement
  mairie:
    build: ./depot/demonstrateur/mairie
    image: maillage-mairie
    container_name: maillage-mairie
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
    environment:
      ESPACE_DIR: /espace
      CONTENUS_DIR: /contenus
      DONNEES_DIR: /maillage/donnees
      ENCARTS_FILE: /maillage/depot/demonstrateur/pipeline/encarts.json
      USAGE_LOG: /maillage/logs/usage.log
      ORIGIN: https://maillage.tuatam.fr
      MAIL: msmtp
      BRAND_FILE: /maillage/depot/demonstrateur/brand.json
    volumes:
      - ./depot/demonstrateur/mairie:/app:ro
      - ./espace:/espace
      - ./contenus:/contenus
      # données en ligne, registre des communes, journal d'usage (dossier parent : donnees/ est renommé à chaque mise à jour)
      - .:/maillage:ro
      - /srv/sites/_mail/msmtprc:/run/secrets-msmtp/msmtprc:ro
    networks: [interne]
networks:
  coolify:
    external: true
  interne: {}
